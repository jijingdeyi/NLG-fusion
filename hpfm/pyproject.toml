[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hpfm"
version = "0.1.0"
description = "Human-Preference Fusion Metric (HPFM) for infrared-visible image fusion"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "NLG-fusion" }]
keywords = ["image-fusion", "IVIF", "preference", "metric"]
dependencies = [
  "torch>=2.0",
  "torchvision>=0.15",
  "numpy>=1.23",
  "opencv-python>=4.7",
  "Pillow>=9.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "build", "twine"]

[project.urls]
Homepage = "https://github.com/example/NLG-fusion"
Documentation = "https://github.com/example/NLG-fusion/tree/main/hpfm"

[project.scripts]
hpfm = "hpfm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hpfm = ["weights.pt"]
