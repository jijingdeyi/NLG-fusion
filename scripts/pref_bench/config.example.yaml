# Preference-bench build config (example)
#
# Copy and edit paths for your machine:
#   cp scripts/pref_bench/config.example.yaml /path/to/pref_bench/config.yaml
#
# Layout expected under out_root after build + annotate:
#   scenes.jsonl  pairs.jsonl  annotations.jsonl  labels_*.jsonl
#   supervision.jsonl  candidates.jsonl  annotators.jsonl  fit/
#
# Optional extra packs for browse_labels.py. Each path is a supervision.jsonl.
# browse_packs:
#   - id: holdout
#     label: Hold-out pack
#     path: /path/to/other/supervision.jsonl

seed: 443

# Preference database root (created by build.py / annotate.py)
out_root: /path/to/pref_bench

# Official fusion method outputs:
#   {sota_root}/{DatasetName}/{method}/<same filename as ir/vi>
sota_root: /path/to/sota

datasets:
  FMB:
    root: /path/to/FMB/test
    n_scenes: 60
    gallery_pool: 120
  M3FD:
    root: /path/to/M3FD/M3FD_Fusion
    n_scenes: 60
    gallery_pool: 120
  MSRS:
    root: /path/to/MSRS/test
    n_scenes: 80
    gallery_pool: 200

split:
  train: 0.60
  val: 0.20
  test: 0.20

# Near-duplicate scene grouping (IR+VI thumbnail MAE)
near_dup_mae: 0.05

# K=8 candidates: priors + 4 public methods + exposure degradations
candidates:
  - name: prior_max
    type: prior
    mode: max
  - name: prior_mhf
    type: prior
    mode: m_hf
    alpha: 1.0
  - name: method_a
    type: sota
    method: tardal
  - name: method_b
    type: sota
    method: cddfuse
  - name: method_c
    type: sota
    method: swinfusion
  - name: method_d
    type: sota
    method: ddfm
  - name: deg_overexp
    type: degrade
    seed: method_a
    mode: overexp
    gain: 1.4
  - name: deg_underexp
    type: degrade
    seed: method_a
    mode: underexp
    gain: 1.4

pairs_per_scene: 8

annotator_ids: [ann0, ann1, ann2]
annotators:
  - annotator_id: ann0
    expertise: professional
  - annotator_id: ann1
    expertise: professional
  - annotator_id: ann2
    expertise: non-professional
eta: 0.5
